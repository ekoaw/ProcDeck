; The program each instance runs: one command[] line per argument, no shell.
; Relative paths are relative to workdir; a bare name is looked up on the PATH.
; See README.md, "The command".
command[] = ./bin/service
;command[] = --port=8080
;command[] = /usr/bin/php
;command[] = service.php

; The folder the instances run in, relative to this folder (or a full path).
workdir = ..

; Shown in the window titles and the main screen's heading.
name = ProcDeck

; Environment label, shown as [STAGING] next to the name: production or prod in
; red, anything else in yellow. Empty = no label.
environment =

; Language of the screens and logs: en or id.
lang = en

; Size the log folder (run/logs) is kept under, in MB. Above it, the oldest log
; files are deleted. Files a running instance writes to are never deleted.
log_max_total_mb = 20

; Extra environment variables for each instance. {n} is the instance number,
; {host} the server's name in lowercase, {environment} the label above. Every
; instance also gets PROCDECK_INSTANCE={n}.
[instance_env]
;INSTANCE_NAME = {host}-{environment}-{n}

; Overrides for single texts, by key (see lang.go), for example:
[text]
;all_crash_loop = "!! Every instance is in a crash loop: check .env and the database. See the log: [5]"
