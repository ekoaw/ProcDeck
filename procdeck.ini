; php.exe for the menu and every instance: its full path, or just php.exe when
; it is on the PATH.
php = C:\php\php.exe

; The script to run, relative to this folder (or a full path).
script = ../service.php

; Working directory of the instances, relative to this folder (or a full path).
; Empty = the script's folder.
workdir =

; Shown in the window titles and the main screen's heading.
name = ProcDeck

; Environment label, shown as [STAGING] next to the name: production or prod in
; red, anything else in yellow. Empty = no label.
environment =

; Language of the screens and logs: a file in lang\ (en, id).
lang = en

; Size the log folder (run\logs) is kept under, in MB. Above it, the oldest log
; files are deleted. Files a running instance writes to are never deleted.
log_max_total_mb = 20

; Extra environment variables for each instance. {n} is the instance number,
; {host} the server's name in lowercase, {environment} the label above. Every
; instance also gets PROCDECK_INSTANCE={n}.
[instance_env]
;INSTANCE_NAME = {host}-{environment}-{n}

; Overrides for single texts of the lang file, by key, for example:
[text]
;all_crash_loop = "!! Every instance is in a crash loop: check .env and the database. See the log: [6]"
